<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Reactor Control Systems</title>
  <meta name="description" content="An interactive map of a fusion machine's main parts and how each one is controlled.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-text="site.title"></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-view-link="home" data-text="nav.home"></a>
      <a href="#why" data-view-link="why" data-text="nav.why"></a>
    </nav>
  </header>

  <main>
    <!-- A. Home: select your machine -->
    <section id="view-home" class="view" aria-labelledby="home-title">
      <h1 id="home-title" data-text="views.home.title"></h1>
      <p class="intro" data-text="views.home.intro"></p>
      <div class="machine-grid" id="machine-grid"></div>
    </section>

    <!-- B. Tokamak: cross-section + info panel (reached from the home card) -->
    <section id="view-tokamak" class="view" aria-labelledby="tokamak-title" hidden>
      <a class="back-link" href="#home" data-text="views.tokamak.back"></a>
      <h1 id="tokamak-title" data-text="views.tokamak.title"></h1>
      <p class="intro" data-text="views.tokamak.intro"></p>
      <div class="tokamak-layout">
        <div class="visuals">
          <figure class="frame frame-overview">
            <figcaption class="frame-label" data-text="views.tokamak.overviewLabel"></figcaption>
          </figure>
          <figure class="frame frame-cross-section" id="cross-section">
            <figcaption class="frame-label" data-text="views.tokamak.crossSectionLabel"></figcaption>
            <svg class="xs" viewBox="0 0 620 750" role="group" aria-label="Tokamak cross-section">
              <defs>
                <radialGradient id="plasma-glow" cx="45%" cy="50%" r="60%">
                  <stop offset="0%" style="stop-color: var(--plasma-b); stop-opacity: 0.85"/>
                  <stop offset="55%" style="stop-color: var(--plasma-a); stop-opacity: 0.55"/>
                  <stop offset="100%" style="stop-color: var(--plasma-a); stop-opacity: 0.08"/>
                </radialGradient>
                <filter id="plasma-blur" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="6"/>
                </filter>
              </defs>

              <!-- Axis of the doughnut (not a part) -->
              <line class="axis" x1="30" y1="40" x2="30" y2="660"/>
              <text class="xs-label" transform="translate(20 350) rotate(-90)" text-anchor="middle" data-text="views.tokamak.axisLabel"></text>

              <!-- Toroidal field coil: a loop around the vessel and shaping coils -->
              <g class="part" data-part="tf">
                <rect class="shape" x="88" y="96" width="296" height="528" rx="36"/>
                <rect class="hit" x="88" y="96" width="296" height="528" rx="36"/>
              </g>

              <!-- Poloidal field system: ohmic transformer, 16 shaping coils, fast in-vessel coils -->
              <g class="part" data-part="pf">
                <!-- Ohmic transformer: central column, plus coils above and below -->
                <rect class="solid" x="40" y="150" width="18" height="76"/>
                <rect class="solid" x="40" y="234" width="18" height="76"/>
                <rect class="solid" x="40" y="318" width="18" height="84"/>
                <rect class="solid" x="40" y="410" width="18" height="76"/>
                <rect class="solid" x="40" y="494" width="18" height="76"/>
                <rect class="solid" x="64" y="64" width="24" height="16"/>
                <rect class="solid" x="100" y="52" width="24" height="16"/>
                <rect class="solid" x="64" y="640" width="24" height="16"/>
                <rect class="solid" x="100" y="652" width="24" height="16"/>
                <!-- Shaping coils: inboard stack of 8 -->
                <rect class="solid" x="106" y="176" width="20" height="32"/>
                <rect class="solid" x="106" y="224" width="20" height="32"/>
                <rect class="solid" x="106" y="272" width="20" height="32"/>
                <rect class="solid" x="106" y="320" width="20" height="32"/>
                <rect class="solid" x="106" y="368" width="20" height="32"/>
                <rect class="solid" x="106" y="416" width="20" height="32"/>
                <rect class="solid" x="106" y="464" width="20" height="32"/>
                <rect class="solid" x="106" y="512" width="20" height="32"/>
                <!-- Shaping coils: outboard stack of 8 -->
                <rect class="solid" x="342" y="176" width="20" height="32"/>
                <rect class="solid" x="342" y="224" width="20" height="32"/>
                <rect class="solid" x="342" y="272" width="20" height="32"/>
                <rect class="solid" x="342" y="320" width="20" height="32"/>
                <rect class="solid" x="342" y="368" width="20" height="32"/>
                <rect class="solid" x="342" y="416" width="20" height="32"/>
                <rect class="solid" x="342" y="464" width="20" height="32"/>
                <rect class="solid" x="342" y="512" width="20" height="32"/>
                <!-- Fast in-vessel coils: top and bottom outer corners -->
                <rect class="solid" x="290" y="134" width="14" height="14"/>
                <rect class="solid" x="290" y="572" width="14" height="14"/>
              </g>

              <!-- Vacuum vessel and divertor -->
              <g class="part" data-part="vessel">
                <rect class="shape" x="156" y="116" width="168" height="488" rx="26"/>
                <rect class="shape" x="164" y="124" width="152" height="472" rx="20"/>
                <rect class="hit" x="160" y="120" width="160" height="480" rx="23"/>
                <!-- Divertor: plasma legs reaching the floor, and baffle plates -->
                <rect class="hit-area" x="164" y="500" width="152" height="96"/>
                <path class="leg" d="M215 487 L190 596 M215 487 L262 596"/>
                <rect class="solid" x="164" y="538" width="34" height="5"/>
                <rect class="solid" x="282" y="538" width="34" height="5"/>
              </g>

              <!-- Plasma: an elongated D shape (path drawn by app.js) -->
              <g class="part" data-part="plasma">
                <path class="plasma-glow" id="plasma-glow-shape"/>
                <path class="plasma-edge" id="plasma-shape"/>
              </g>

              <!-- Heating: two microwave launchers (side and top) and a neutral beam port -->
              <g class="part" data-part="heating">
                <rect class="solid" x="262" y="58" width="16" height="58"/>
                <rect class="solid" x="324" y="258" width="90" height="12"/>
                <rect class="solid" x="324" y="354" width="100" height="12"/>
                <path class="beam" d="M270 116 L256 300 M324 264 L284 318 M324 360 L290 360"/>
                <path class="hit" d="M270 116 L256 300 M324 264 L284 318 M324 360 L290 360"/>
                <text class="xs-label" x="430" y="364" data-text="views.tokamak.nbiLabel"></text>
              </g>

              <!-- Fuelling: a gas valve on a port -->
              <g class="part" data-part="fuelling">
                <rect class="solid" x="324" y="452" width="70" height="8"/>
                <path class="solid" d="M396 446 L416 466 L416 446 L396 466 Z"/>
              </g>

              <!-- Diagnostics: magnetic probes on the wall, one laser line of sight -->
              <g class="part" data-part="diagnostics">
                <line class="shape chord" x1="222" y1="100" x2="222" y2="620"/>
                <line class="hit hit-thin" x1="222" y1="100" x2="222" y2="620"/>
                <circle class="solid" cx="169" cy="180" r="3.5"/>
                <circle class="solid" cx="169" cy="260" r="3.5"/>
                <circle class="solid" cx="169" cy="340" r="3.5"/>
                <circle class="solid" cx="169" cy="420" r="3.5"/>
                <circle class="solid" cx="169" cy="500" r="3.5"/>
                <circle class="solid" cx="311" cy="200" r="3.5"/>
                <circle class="solid" cx="311" cy="300" r="3.5"/>
                <circle class="solid" cx="311" cy="400" r="3.5"/>
                <circle class="solid" cx="311" cy="500" r="3.5"/>
                <circle class="solid" cx="205" cy="129" r="3.5"/>
                <circle class="solid" cx="270" cy="591" r="3.5"/>
              </g>

              <!-- Power supplies & plant: below the machine -->
              <g class="part" data-part="plant">
                <rect class="box" x="30" y="686" width="410" height="46" rx="4"/>
                <text class="xs-label" x="235" y="713" text-anchor="middle" data-text="views.tokamak.plantLabel"></text>
              </g>

              <!-- Control room: outside the machine -->
              <g class="part" data-part="control">
                <path class="shape link" d="M535 410 L535 709 L440 709"/>
                <rect class="box" x="470" y="300" width="130" height="110" rx="4"/>
                <rect class="shape" x="484" y="320" width="30" height="20" rx="2"/>
                <rect class="shape" x="520" y="320" width="30" height="20" rx="2"/>
                <rect class="shape" x="556" y="320" width="30" height="20" rx="2"/>
                <text class="xs-label" x="535" y="380" text-anchor="middle" data-text="views.tokamak.controlLabel"></text>
              </g>
            </svg>
            <div class="tooltip" id="xs-tooltip" role="tooltip" hidden></div>
          </figure>
          <nav class="parts-list" aria-labelledby="parts-list-title">
            <h2 id="parts-list-title" data-text="views.tokamak.listTitle"></h2>
            <ul id="parts-list"></ul>
          </nav>
        </div>
        <aside class="info-panel" id="info-panel" aria-live="polite">
          <p class="muted" data-text="views.tokamak.panelEmpty"></p>
        </aside>
      </div>
    </section>

    <!-- C. Why I built this -->
    <section id="view-why" class="view" aria-labelledby="why-title" hidden>
      <h1 id="why-title" data-text="views.why.title"></h1>
      <p class="intro" data-text="views.why.intro"></p>
      <div id="why-body"></div>
    </section>
  </main>

  <footer class="footer">
    <p>
      <span data-text="site.footer"></span>
      Built by <span data-text="site.author"></span> ·
      <a class="repo-link" data-href="site.repoUrl" data-text="site.repoLabel"></a>
    </p>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
