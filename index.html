<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Reactor Control Systems</title>
  <meta name="description" content="An interactive map of a fusion machine's main parts and how each one is controlled.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-text="site.title"></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-view-link="home" data-text="nav.home"></a>
      <a href="#why" data-view-link="why" data-text="nav.why"></a>
    </nav>
  </header>

  <main>
    <!-- A. Home: select your machine -->
    <section id="view-home" class="view" aria-labelledby="home-title">
      <h1 id="home-title" data-text="views.home.title"></h1>
      <p class="intro" data-text="views.home.intro"></p>
      <div class="machine-grid" id="machine-grid"></div>
    </section>

    <!-- B. Tokamak: cross-section + info panel (reached from the home card) -->
    <section id="view-tokamak" class="view" aria-labelledby="tokamak-title" hidden>
      <a class="back-link" href="#home" data-text="views.tokamak.back"></a>
      <h1 id="tokamak-title" data-text="views.tokamak.title"></h1>
      <p class="intro" data-text="views.tokamak.intro"></p>
      <div class="tokamak-layout">
        <div class="visuals">
          <figure class="frame frame-overview" id="overview">
            <figcaption class="frame-label" data-text="views.tokamak.overviewLabel"></figcaption>
          </figure>
          <figure class="frame frame-cross-section" id="cross-section">
            <figcaption class="frame-label" data-text="views.tokamak.crossSectionLabel"></figcaption>
            <svg class="xs" viewBox="0 0 540 750" role="group" aria-label="Tokamak cross-section">
              <defs>
                <radialGradient id="plasma-glow" cx="45%" cy="50%" r="60%">
                  <stop offset="0%" style="stop-color: var(--plasma-b); stop-opacity: 0.85"/>
                  <stop offset="55%" style="stop-color: var(--plasma-a); stop-opacity: 0.55"/>
                  <stop offset="100%" style="stop-color: var(--plasma-a); stop-opacity: 0.08"/>
                </radialGradient>
                <filter id="plasma-blur" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="6"/>
                </filter>
              </defs>

              <!-- Axis of the doughnut (not a part) -->
              <line class="axis" x1="30" y1="40" x2="30" y2="660"/>
              <text class="xs-label" transform="translate(20 350) rotate(-90)" text-anchor="middle" data-text="views.tokamak.axisLabel"></text>

              <!-- Vacuum vessel: tall and narrow, with cut outboard corners (not a part) -->
              <g class="vessel">
                <path d="M170 116 H265 L324 181 V539 L265 604 H170 Q156 604 156 590 V130 Q156 116 170 116 Z"/>
                <path d="M170 124 H262 L316 184 V536 L262 596 H170 Q164 596 164 590 V130 Q164 124 170 124 Z"/>
                <text class="xs-label" x="240" y="616" text-anchor="middle" data-text="views.tokamak.vesselLabel"></text>
              </g>

              <!-- Toroidal field coil: a loop around the vessel and shaping coils -->
              <g class="part" data-part="tf">
                <rect class="shape" x="88" y="96" width="296" height="528" rx="36"/>
                <rect class="hit" x="88" y="96" width="296" height="528" rx="36"/>
                <text class="xs-label" x="394" y="94" data-text="views.tokamak.labels.tf"></text>
              </g>

              <!-- Central solenoid (ohmic transformer): central column, plus coils above and below -->
              <g class="part" data-part="cs">
                <rect class="solid" x="40" y="150" width="18" height="76"/>
                <rect class="solid" x="40" y="234" width="18" height="76"/>
                <rect class="solid" x="40" y="318" width="18" height="84"/>
                <rect class="solid" x="40" y="410" width="18" height="76"/>
                <rect class="solid" x="40" y="494" width="18" height="76"/>
                <rect class="solid" x="64" y="64" width="24" height="16"/>
                <rect class="solid" x="100" y="52" width="24" height="16"/>
                <rect class="solid" x="64" y="640" width="24" height="16"/>
                <rect class="solid" x="100" y="652" width="24" height="16"/>
                <path class="leader" d="M49 576 V686"/>
                <text class="xs-label" x="40" y="702" data-text="views.tokamak.labels.cs"></text>
              </g>

              <!-- Shaping coils (poloidal field): inboard and outboard stacks of 8, plus 2 fast in-vessel coils -->
              <g class="part" data-part="pf" id="pf-coils">
                <rect class="solid coil" x="106" y="176" width="20" height="32"/>
                <rect class="solid coil" x="106" y="224" width="20" height="32"/>
                <rect class="solid coil" x="106" y="272" width="20" height="32"/>
                <rect class="solid coil" x="106" y="320" width="20" height="32"/>
                <rect class="solid coil" x="106" y="368" width="20" height="32"/>
                <rect class="solid coil" x="106" y="416" width="20" height="32"/>
                <rect class="solid coil" x="106" y="464" width="20" height="32"/>
                <rect class="solid coil" x="106" y="512" width="20" height="32"/>
                <rect class="solid coil" x="342" y="176" width="20" height="32"/>
                <rect class="solid coil" x="342" y="224" width="20" height="32"/>
                <rect class="solid coil" x="342" y="272" width="20" height="32"/>
                <rect class="solid coil" x="342" y="320" width="20" height="32"/>
                <rect class="solid coil" x="342" y="368" width="20" height="32"/>
                <rect class="solid coil" x="342" y="416" width="20" height="32"/>
                <rect class="solid coil" x="342" y="464" width="20" height="32"/>
                <rect class="solid coil" x="342" y="512" width="20" height="32"/>
                <rect class="solid coil" x="280" y="160" width="12" height="12"/>
                <rect class="solid coil" x="280" y="548" width="12" height="12"/>
                <path class="leader" d="M366 192 H390"/>
                <text class="xs-label" x="394" y="196" data-text="views.tokamak.labels.pf"></text>
              </g>

              <!-- Plasma: shape, magnetic surfaces, divertor legs and X-points (drawn by app.js) -->
              <g class="part" data-part="plasma">
                <path class="plasma-glow" id="plasma-glow-a"/>
                <path class="plasma-glow" id="plasma-glow-b"/>
                <path class="flux" id="plasma-flux"/>
                <path class="plasma-edge" id="plasma-edge"/>
                <g class="plasma-extras" id="plasma-extras">
                  <path class="leg" id="plasma-legs"/>
                  <path class="x-point" id="plasma-xpoints"/>
                </g>
                <path class="leader" d="M310 360 H390"/>
                <text class="xs-label" x="394" y="364" data-text="views.tokamak.labels.plasma"></text>
              </g>

            </svg>
            <div class="tooltip" id="xs-tooltip" role="tooltip" hidden></div>
          </figure>
          <nav class="parts-list" aria-labelledby="parts-list-title">
            <h2 id="parts-list-title" data-text="views.tokamak.listTitle"></h2>
            <ul id="parts-list"></ul>
          </nav>
          <section class="shapes" id="shapes" aria-labelledby="shapes-title">
            <h2 id="shapes-title" data-text="shapes.title"></h2>
            <p class="muted" data-text="shapes.intro"></p>
            <div class="shape-picker" id="shape-picker" role="group" aria-labelledby="shapes-title"></div>
            <div class="shape-detail" id="shape-detail" aria-live="polite"></div>
            <p class="shapes-note" data-text="shapes.note"></p>
          </section>
        </div>
        <aside class="info-panel" id="info-panel" aria-live="polite">
          <p class="muted" data-text="views.tokamak.panelEmpty"></p>
        </aside>
      </div>
    </section>

    <!-- C. Why I built this -->
    <section id="view-why" class="view" aria-labelledby="why-title" hidden>
      <h1 id="why-title" data-text="views.why.title"></h1>
      <p class="intro" data-text="views.why.intro"></p>
      <div id="why-body"></div>
    </section>
  </main>

  <footer class="footer">
    <p>
      <span data-text="site.footer"></span>
      Built by <span data-text="site.author"></span> ·
      <a class="repo-link" data-href="site.repoUrl" data-text="site.repoLabel"></a>
    </p>
  </footer>

  <script src="content.js"></script>
  <script src="shapes.js"></script>
  <script src="app.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="overview.js"></script>
</body>
</html>
